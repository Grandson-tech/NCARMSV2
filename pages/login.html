<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/NCARMSV2/config/runtime-config.js"></script>
  <link rel="stylesheet" href="/NCARMSV2/assets/css/ncarms.css">
  <title>Sign in | NCARMS — Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services</title>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-4 py-8 md:px-6">
    <section class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="login-title">
      <div class="mb-6">
        <p class="text-sm font-medium text-blue-700">NCARMS</p>
        <p class="mt-1 text-xs leading-5 text-slate-500">Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services</p>
        <h1 id="login-title" class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">Sign in</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600">For authorized ICT and HR staff only.</p>
      </div>
      <div id="login-feedback" class="rounded-lg border p-4 text-sm" role="alert" aria-live="assertive" hidden></div>
      <form id="login-form" class="mt-4 space-y-4" novalidate>
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-slate-700" for="login-email">Email address</label>
          <input id="login-email" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" name="email" type="email" autocomplete="email" aria-describedby="login-email-error" required>
          <p id="login-email-error" class="hidden text-xs text-red-700" data-error-for="login-email"></p>
        </div>
        <div class="space-y-1.5">
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-slate-700" for="login-password">Password</label>
            <a class="text-sm font-medium text-blue-700 hover:text-blue-800 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" href="reset-password-request.html">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="login-password" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 pr-12 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" name="password" type="password" autocomplete="current-password" aria-describedby="login-password-error" required>
            <button class="absolute inset-y-0 right-0 inline-flex w-10 items-center justify-center rounded-r-md text-xs font-medium text-blue-700 hover:text-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-inset" type="button" data-password-toggle="#login-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p id="login-password-error" class="hidden text-xs text-red-700" data-error-for="login-password"></p>
        </div>
        <button class="inline-flex h-10 w-full items-center justify-center rounded-md bg-blue-700 px-4 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" type="submit"><span data-button-label>Sign in</span></button>
      </form>
    </section>
  </main>
  <script type="module" src="../src/modules/auth/login-controller.js"></script>
</body>
</html>
