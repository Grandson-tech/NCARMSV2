<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/NCARMSV2/config/runtime-config.js"></script>
  <link rel="stylesheet" href="/NCARMSV2/assets/css/ncarms.css">
  <title>Reset password | NCARMS — Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services</title>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-4 py-8 md:px-6">
    <section class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="reset-request-title">
      <div class="mb-6"><p class="text-sm font-medium text-blue-700">NCARMS</p><p class="mt-1 text-xs leading-5 text-slate-500">Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services</p><h1 id="reset-request-title" class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">Reset your password</h1><p class="mt-2 text-sm leading-6 text-slate-600">Enter your staff email address to receive reset instructions.</p></div>
      <div id="password-reset-feedback" class="rounded-lg border p-4 text-sm" role="status" aria-live="polite" hidden></div>
      <form id="password-reset-request-form" class="mt-4 space-y-4" novalidate>
        <div class="space-y-1.5"><label class="text-sm font-medium text-slate-700" for="reset-request-email">Email address</label><input id="reset-request-email" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" name="email" type="email" autocomplete="email" aria-describedby="reset-request-email-error" required><p id="reset-request-email-error" class="hidden text-xs text-red-700" data-error-for="reset-request-email"></p></div>
        <button class="inline-flex h-10 w-full items-center justify-center rounded-md bg-blue-700 px-4 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" type="submit"><span data-button-label>Send reset instructions</span></button>
      </form>
      <p class="mt-6 text-sm text-slate-600"><a class="font-medium text-blue-700 hover:text-blue-800 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script type="module" src="../src/modules/auth/reset-password-request-controller.js"></script>
</body>
</html>
