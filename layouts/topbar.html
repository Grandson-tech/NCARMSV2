<header class="flex h-[4.5rem] items-center justify-between border-b border-slate-200/90 bg-white px-4 shadow-sm md:px-6 lg:px-8">
  <div class="flex min-w-0 items-center gap-3">
    <button
      id="sidebar-toggle"
      class="inline-flex h-10 w-10 items-center justify-center rounded-md text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 lg:hidden"
      type="button"
      aria-controls="app-sidebar"
      aria-expanded="false"
      aria-label="Open navigation menu"
    >
      <svg class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <nav class="min-w-0" aria-label="Breadcrumb">
      <ol id="breadcrumb-list" class="flex items-center gap-2 overflow-hidden text-sm font-medium text-slate-500"></ol>
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <button class="inline-flex h-10 w-10 items-center justify-center rounded-md text-slate-700 hover:bg-slate-100 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" type="button" aria-label="Notifications placeholder">
      <svg class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m2 0v1a1 1 0 1 1-2 0v-1m2 0H9" /></svg>
    </button>
    <div class="relative">
      <button id="profile-menu-toggle" class="inline-flex h-11 items-center gap-3 rounded-control border-l border-slate-200 px-3 text-left text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" type="button" aria-controls="profile-menu" aria-expanded="false">
        <span class="flex h-9 w-9 items-center justify-center rounded-md bg-blue-900 font-serif text-xs font-semibold text-white" aria-hidden="true">OA</span>
        <span class="hidden sm:block"><span class="block font-semibold leading-4 text-slate-900">Officer Account</span><span class="block max-w-56 truncate text-xs font-normal leading-4 text-slate-500" title="Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services">Narok County Department of Education, Sports, Youth Affairs, Gender &amp; Social Services</span></span>
        <svg class="h-4 w-4" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m7 10 5 5 5-5" /></svg>
      </button>
      <div id="profile-menu" class="absolute right-0 z-50 mt-2 hidden w-56 rounded-surface border border-slate-200/90 bg-white p-2 shadow-lg" role="menu" aria-label="Officer account menu">
        <p class="px-3 py-2 text-xs text-slate-500">Profile options will be available here.</p>
      </div>
    </div>
  </div>
</header>
